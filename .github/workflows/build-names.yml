# Сборка датасета русских названий: раз в неделю сама и кнопкой по просьбе.
#
# ПРО ТОКЕН. Задача по расписанию отключается после 60 дней без человеческой
# активности в репозитории, а действия встроенного токена робота активностью
# не считаются. Личный токен ANIMORI_DATA_TOKEN это лечит, но он сам однажды
# протухает — и тоже молча. Поэтому секрет остаётся необязательным запасом,
# а следит за живостью датасета сторож со стороны: прогон watch-dataset
# в репозитории приложения смотрит на возраст выпуска и заводит задачу,
# когда выпуск старее десяти дней. Он ловит любую причину протухания,
# а не только засыпание расписания.

name: build-names

on:
  schedule:
    # Понедельник, 04:27 UTC. Манами выкладывает недельный выпуск
    # на выходных, к утру понедельника он уже на месте. Минуты
    # не круглые намеренно: в начале часа очередь задач у GitHub
    # самая длинная, и запуск сдвигается на непредсказуемое время.
    - cron: '27 4 * * 1'
  workflow_dispatch:
    inputs:
      pause:
        description: Пауза между запросами к Шикимори, мс
        required: false
        default: '700'
      publish:
        description: Публиковать выпуск
        required: false
        type: boolean
        default: true
      # Списком, а не двумя галочками, и притом нарочно. У запуска
      # по расписанию входных полей нет вовсе, а пустая галочка
      # в сравнении с false даёт истину: волны выключились бы сами
      # и ровно там, где они нужнее всего.
      waves:
        description: Волны обогащения
        required: false
        type: choice
        default: обе
        options:
          - обе
          - только карта
          - только имена
          - никакие
      budget:
        description: Бюджет волны имён, минут
        required: false
        default: '60'

# Выпуск и отметка пишут в репозиторий, значит нужна запись в содержимое.
# С личным токеном этот раздел ни на что не влияет, он для встроенного.
permissions:
  contents: write

# Две сборки разом не нужны: каждая полезла бы выпускать своё.
# Идущая дорабатывает до конца: час с лишним опроса трёх источников
# выбрасывать жалко.
concurrency:
  group: build-names
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Обход Шикимори — около десяти минут, волна карты — около пяти,
    # волна имён сама себя ограничивает бюджетом. Запас взят на то,
    # что все три источника отвечают медленно одновременно.
    timeout-minutes: 120

    steps:
      - name: Исходный код
        uses: actions/checkout@v4
        with:
          # Тем же токеном потом уходит отметка о сборке.
          token: ${{ secrets.ANIMORI_DATA_TOKEN || github.token }}

      - name: Сборка
        env:
          # У запуска по расписанию входных полей нет вовсе: без запасного
          # значения сборщик получил бы пустую паузу и ушёл в отказы Шикимори.
          BUILD_PAUSE: ${{ inputs.pause || '700' }}
          NAMES_BUDGET: ${{ inputs.budget || '60' }}
          # Сравнение с ожидаемым значением, а не с пустотой: пустое поле
          # у расписания ни одному из условий не подходит, и волны остаются включёнными.
          BUILD_ANILIST: ${{ (inputs.waves == 'только имена' || inputs.waves == 'никакие') && 'off' || 'on' }}
          BUILD_ANIME365: ${{ (inputs.waves == 'только карта' || inputs.waves == 'никакие') && 'off' || 'on' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -v
          node scripts/build-names.mjs

      # Артефакт нужен и без публикации: посмотреть на файлы можно,
      # ничего никому не выпуская.
      - name: Файлы наружу
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: |
            index.json
            titles-anime.json.gz
            map-mal-anilist.json.gz
          if-no-files-found: warn

      # Расписание выпускает всегда: галочки у него нет, а сборка без выпуска
      # раз в неделю не нужна никому.
      - name: Выпуск
        id: release
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.ANIMORI_DATA_TOKEN || github.token }}
        run: |
          tag="$(date -u +%Y.%m.%d-%H%M)"
          gh release create "$tag" \
            --title "Названия $tag" \
            --notes-file release-notes.md \
            --latest \
            index.json titles-anime.json.gz map-mal-anilist.json.gz
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Отметка живого репозитория. Пустой коммит для этого не годится:
      # видимый файл заодно отвечает на вопрос «когда робот работал последний
      # раз» без похода в задачи.
      #
      # Собирается только после удавшегося выпуска: отметка о том, чего не вышло,
      # врала бы в истории.
      - name: Отметка о сборке
        if: ${{ steps.release.outputs.tag != '' }}
        run: |
          git config user.name 'AniMori robot'
          git config user.email 'noreply@github.com'
          printf '%s\n' "${{ steps.release.outputs.tag }}" > .github/last-build
          git add .github/last-build
          git commit -m "Выпуск ${{ steps.release.outputs.tag }}"
          git push
